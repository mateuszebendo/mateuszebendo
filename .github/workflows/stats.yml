name: Estatísticas do perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar assets/stats.svg
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza estatísticas" && git push)
