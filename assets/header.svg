<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340">
  <defs>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#008080"/>
      <rect width="1" height="1" fill="#007070"/>
    </pattern>
    <style>
      .ui { font-family: 'MS Sans Serif','Microsoft Sans Serif',Tahoma,Verdana,Arial,sans-serif; }
      .mono { font-family: 'Fixedsys','Lucida Console','Courier New',monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { animation: type 3.2s steps(26) 0.4s both; }
      @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      .pop { animation: pop .35s ease-out both; transform-origin: 420px 150px; }
      @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
  </defs>

  <!-- desktop -->
  <rect width="840" height="340" fill="url(#dots)"/>

  <!-- desktop icons -->
  <g class="ui" font-size="11" fill="#fff" text-anchor="middle">
    <!-- Meu Computador -->
    <g transform="translate(22,18)">
      <rect x="8" y="2" width="30" height="22" fill="#c0c0c0" stroke="#000"/>
      <rect x="12" y="6" width="22" height="14" fill="#000080"/>
      <rect x="4" y="26" width="38" height="6" fill="#c0c0c0" stroke="#000"/>
      <text x="23" y="48">Meu</text><text x="23" y="61">Computador</text>
    </g>
    <!-- Lixeira -->
    <g transform="translate(22,92)">
      <path d="M12 6 h22 l-3 28 h-16 z" fill="#d4d0c8" stroke="#000"/>
      <rect x="9" y="2" width="28" height="5" fill="#c0c0c0" stroke="#000"/>
      <line x1="18" y1="10" x2="19" y2="30" stroke="#808080"/>
      <line x1="23" y1="10" x2="23" y2="30" stroke="#808080"/>
      <line x1="28" y1="10" x2="27" y2="30" stroke="#808080"/>
      <text x="23" y="50">Lixeira</text>
    </g>
    <!-- void.exe -->
    <g transform="translate(22,166)">
      <rect x="8" y="2" width="30" height="30" fill="#000" stroke="#c0c0c0"/>
      <circle cx="23" cy="17" r="8" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="23" cy="17" r="2" fill="#fff"/>
      <text x="23" y="48">void.exe</text>
    </g>
  </g>

  <!-- main window -->
  <g class="pop">
    <!-- outer bevel -->
    <rect x="130" y="22" width="660" height="262" fill="#c0c0c0"/>
    <path d="M130 284 V22 H790" fill="none" stroke="#dfdfdf" stroke-width="2"/>
    <path d="M131 284 H790 V23" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M133 281 H787 V25" fill="none" stroke="#808080" stroke-width="1.5"/>

    <!-- title bar -->
    <rect x="135" y="27" width="650" height="22" fill="url(#title)"/>
    <g transform="translate(140,30)">
      <rect width="16" height="16" fill="#000" />
      <circle cx="8" cy="8" r="5" fill="none" stroke="#fff" stroke-width="1.6"/>
      <circle cx="8" cy="8" r="1.4" fill="#fff"/>
    </g>
    <text x="162" y="43" class="ui" font-size="13" font-weight="bold" fill="#fff">mateus.exe — Olá, mundo!</text>
    <!-- title buttons -->
    <g class="ui" font-size="12" font-weight="bold" text-anchor="middle">
      <g transform="translate(727,30)">
        <rect width="16" height="14" fill="#c0c0c0"/><path d="M0 14V0H16" fill="none" stroke="#fff"/><path d="M0 14H16V0" fill="none" stroke="#000"/>
        <rect x="4" y="9" width="6" height="2" fill="#000"/>
      </g>
      <g transform="translate(745,30)">
        <rect width="16" height="14" fill="#c0c0c0"/><path d="M0 14V0H16" fill="none" stroke="#fff"/><path d="M0 14H16V0" fill="none" stroke="#000"/>
        <rect x="3.5" y="2.5" width="9" height="8" fill="none" stroke="#000"/><rect x="3.5" y="2.5" width="9" height="2" fill="#000"/>
      </g>
      <g transform="translate(765,30)">
        <rect width="16" height="14" fill="#c0c0c0"/><path d="M0 14V0H16" fill="none" stroke="#fff"/><path d="M0 14H16V0" fill="none" stroke="#000"/>
        <path d="M4 3 L12 11 M12 3 L4 11" stroke="#000" stroke-width="1.8"/>
      </g>
    </g>

    <!-- menu bar -->
    <g class="ui" font-size="12" fill="#000">
      <text x="142" y="66"><tspan text-decoration="underline">A</tspan>rquivo</text>
      <text x="200" y="66"><tspan text-decoration="underline">E</tspan>ditar</text>
      <text x="250" y="66"><tspan text-decoration="underline">E</tspan>xibir</text>
      <text x="300" y="66">Aj<tspan text-decoration="underline">u</tspan>da</text>
    </g>

    <!-- content area (sunken) -->
    <rect x="141" y="74" width="638" height="180" fill="#000"/>
    <path d="M141 254 V74 H779" fill="none" stroke="#808080" stroke-width="2"/>
    <path d="M141 254 H779 V74" fill="none" stroke="#fff" stroke-width="2"/>

    <g class="mono" fill="#c0c0c0" font-size="14">
      <text x="156" y="100">Microsoft(R) Windows 98</text>
      <text x="156" y="118">   (C)Copyright Microsoft Corp 1981-1998.</text>
      <text x="156" y="148">C:\&gt; whoami</text>
    </g>
    <g class="type">
      <text x="156" y="190" class="mono" font-size="30" font-weight="bold" fill="#00ff66">Opa, sou o Mateus. 👋</text>
    </g>
    <g class="mono" font-size="14" fill="#c0c0c0">
      <text x="156" y="220">estudante de programação · CEFET/RJ · Nova Friburgo, RJ</text>
      <text x="156" y="242">C:\&gt; <tspan fill="#c0c0c0">enter the void</tspan><tspan class="cursor" fill="#c0c0c0">█</tspan></text>
    </g>

    <!-- status bar -->
    <g class="ui" font-size="11" fill="#000">
      <rect x="141" y="259" width="420" height="18" fill="#c0c0c0"/>
      <path d="M141 277 V259 H561" fill="none" stroke="#808080"/><path d="M141 277 H561 V259" fill="none" stroke="#fff"/>
      <text x="147" y="272">Pronto. Amor pela área beirando a obsessão (alguém me ajuda).</text>
      <rect x="566" y="259" width="213" height="18" fill="#c0c0c0"/>
      <path d="M566 277 V259 H779" fill="none" stroke="#808080"/><path d="M566 277 H779 V259" fill="none" stroke="#fff"/>
      <text x="572" y="272">☕ 100% cafeína</text>
    </g>
  </g>

  <!-- taskbar -->
  <rect x="0" y="306" width="840" height="34" fill="#c0c0c0"/>
  <line x1="0" y1="307" x2="840" y2="307" stroke="#fff" stroke-width="2"/>
  <!-- start button -->
  <g transform="translate(4,311)" class="ui">
    <rect width="66" height="24" fill="#c0c0c0"/>
    <path d="M0 24V0H66" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M0 24H66V0" fill="none" stroke="#000" stroke-width="1.5"/>
    <g transform="translate(6,5)">
      <rect x="0" y="0" width="6" height="6" fill="#ff0000"/>
      <rect x="7" y="0" width="6" height="6" fill="#00a800"/>
      <rect x="0" y="7" width="6" height="6" fill="#0000ff"/>
      <rect x="7" y="7" width="6" height="6" fill="#ffd800"/>
    </g>
    <text x="24" y="17" font-size="13" font-weight="bold" fill="#000">Iniciar</text>
  </g>
  <!-- active task -->
  <g transform="translate(78,311)" class="ui">
    <rect width="170" height="24" fill="#e0e0e0"/>
    <path d="M0 24V0H170" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M0 24H170V0" fill="none" stroke="#fff" stroke-width="1.5"/>
    <rect x="6" y="5" width="14" height="14" fill="#000"/>
    <circle cx="13" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text x="26" y="17" font-size="12" font-weight="bold" fill="#000">mateus.exe</text>
  </g>
  <!-- tray -->
  <g transform="translate(748,311)" class="ui">
    <rect width="88" height="24" fill="#c0c0c0"/>
    <path d="M0 24V0H88" fill="none" stroke="#808080" stroke-width="1.5"/>
    <path d="M0 24H88V0" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="10" y="17" font-size="12">🔊</text>
    <text x="80" y="17" font-size="12" text-anchor="end" fill="#000">21:00</text>
  </g>
</svg>
